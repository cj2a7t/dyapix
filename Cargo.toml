[workspace]
members = ["dyapix", "dyapix-common", "dyapix-proxy"]

[workspace.dependencies]
pingora = { version = "0.6.0", features = ["lb", "rustls", "cache"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
erased-serde = "0.4.8"
dashmap = "6.1.0"
once_cell = "1.21.3"
arc-swap = "1.7.1"
router-radix = "0.4.0"
anyhow = "1.0.98"
thiserror = "2.0.12"
async-trait = "0.1.89"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1"
sqlx = { version = "0.8.6", features = [
    "mysql",
    "chrono",
    "runtime-tokio-native-tls",
] }
config = "0.15.11"
